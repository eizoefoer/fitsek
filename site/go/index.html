<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/?utm_source=instagram&utm_medium=bio&utm_campaign=profile">
  <title>Opening Fitsek…</title>
  <script>
    (() => {
      const target = new URL('/', window.location.origin);
      const params = new URLSearchParams(window.location.search);
      if (!params.has('utm_source')) params.set('utm_source', 'instagram');
      if (!params.has('utm_medium')) params.set('utm_medium', 'bio');
      if (!params.has('utm_campaign')) params.set('utm_campaign', 'profile');
      target.search = params.toString();
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body><p>Opening the Fitsek 7-Day Desk Worker Reset… <a href="/?utm_source=instagram&utm_medium=bio&utm_campaign=profile">Continue</a>.</p></body>
</html>
