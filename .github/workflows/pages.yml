name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Python regression tests
        run: |
          python3 server/test_lead_api.py
          python3 automation/test_business_review.py
          python3 automation/test_meta_token_watch.py
          python3 automation/test_meta_autopilot.py
          python3 automation/test_verify_posts.py
          python3 automation/test_first_sale_funnel.py
      - uses: actions/configure-pages@v5
      - run: python3 scripts/validate_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
